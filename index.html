<!doctype>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width,initial-sacle=1.0"
    <meta name="description"content="Portfolio M Nur Erik Setiawan">
    <title>M Nur Erik Setiawan-Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;18family=Manrope:wght@400;500;600&display=swap">

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
      <main class="page">
      <div class="glow"></div>
        <section class="portfolio"aria-labelledby="name">
          <p class="eyebrow">Porfolio pribadi</p>

          <div class="profile-photo">
            <img src="foto-profil.jpg" alt="Potret M Nur Erik Setiawan">
            <span class="online-dat" title="Sedang Online"></span>
          </div>

          <header class="intro">
            <hi id="name">M Nur Erik Setiawan</hi>
            <p class="role">Bikin Game &amp; Bikin Film Animasi</p>
          </header>

          <ul class="skill">
            <li>Animasi</li>
            <li>Editing</li>
            <li>Fotografi</li>
            <li>Videografi</li>
            <li>Design</li>
            <li>Motion Graphic</li>
          </ul>
        <section class="music-player"aria-label="Pemutar Musik">
          <div class="player-heading">
            <span>Now Playing</span>
            <span class="live-status">●<span id="status">Jeda</span></span>
          </div>
          <div class="song-info">
            <div class="vinly" id="vinly"><span></span></div>
            <div>
              <a id="link"target="_blank"rel="noopener"><h2 id="title">Golden Brown</h2></a>
              <p id="artist">The Stranglres</p>
           </div>
          </div>

          <input class="progress" type="range" min="0" max="209" value="0" aria-label="Posisi lagu">
          <div class="time-row">
            <span id="now">0:00</span>
            <span id="left">-3:27</span>
          </div>

          <div class="controls">
            <button class="icon-button" id="prev" type="button" aria-label="Lagu sebelumnya">«</button>
            <button class="play-button" id="play">▶ <span>Putar</span></button>
            <button class="icon-button" id="next" type="button" aria-label="Lagu berikutnya">»</button>
          </div>

          <div class="song-list" id="list" aria-label="Daftar Lagu"></div>
        </section>

        <p class="footer-note">GOKIIILLLLLLL!!</p>
        </section>
      </main>

    <script type="module" scr="script.js"></script>
</body>
</html>
